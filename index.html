<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Bangun Ruang</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin:0;
      overflow: hidden;
    }

    #character-canvas {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:5;
      pointer-events: none;
    }
  </style>
</head>

<body class="h-screen w-screen bg-cover bg-center"
style="background-image: url('assets/picture/background.jpg');">

<!-- overlay -->
<div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

<!-- canvas 3D -->
<div id="character-canvas"></div>

<!-- layout utama -->
<div class="relative z-10 flex h-full w-full items-center justify-start px-16 gap-10">

  <!-- kiri (kosong untuk space karakter) -->
  <div class="w-1/3"></div>

  <!-- kanan (UI) -->
  <div class="w-1/2 flex flex-col items-start text-white">

    <!-- judul -->
    <div class="text-left mb-6">
      <h1 class="text-4xl md:text-5xl font-black tracking-wider">
        AR BANGUN<span class="text-yellow-400">RUANG</span>
      </h1>
      <p class="text-sm mt-3 opacity-90">
        Media Pembelajaran Interaktif Matematika
      </p>
    </div>

    <!-- halo text -->
    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-4 py-2 mb-4 text-sm text-center">
      Halo! Mari belajar bangun ruang bersamaku!
    </div>

    <!-- menu -->
    <div class="grid grid-cols-2 gap-3 w-full max-w-xs">

      <a href="menu/ar.html"
      class="bg-gradient-to-br from-blue-800 to-purple-800 hover:scale-105 transition-transform rounded-xl p-3 text-center text-sm font-semibold shadow-lg">
        🔮 AR
      </a>

      <a href="menu/materi.html"
      class="bg-gradient-to-br from-blue-800 to-purple-800 hover:scale-105 transition-transform rounded-xl p-3 text-center text-sm font-semibold shadow-lg">
        📘 Materi
      </a>

      <a href="menu/kuis.html"
      class="bg-gradient-to-br from-blue-800 to-purple-800 hover:scale-105 transition-transform rounded-xl p-3 text-center text-sm font-semibold shadow-lg">
        ❓ Kuis
      </a>

      <a href="menu/game.html"
      class="bg-gradient-to-br from-blue-800 to-purple-800 hover:scale-105 transition-transform rounded-xl p-3 text-center text-sm font-semibold shadow-lg">
        🎮 Game
      </a>

    </div>

  </div>
</div>

<!-- THREE JS -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('character-canvas');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// load model
const loader = new GLTFLoader();

let modelGlobal;

loader.load(
  'assets/model3D/anaksd.glb',

  (gltf) => {
    const model = gltf.scene;

    // auto center & scale
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3()).length();
    const center = box.getCenter(new THREE.Vector3());

    model.position.sub(center);
    model.scale.setScalar(2 / size);

    // posisi (kiri & naik)
    model.position.x -= 1.5;
    model.position.y += 1.4;

    // === MIRINGKAN KE KANAN (menghadap tengah) ===
    model.rotation.y = 0.7;   

    scene.add(model);
    modelGlobal = model;

    console.log("MODEL MUNCUL");
  },

  undefined,

  (error) => {
    console.error("ERROR:", error);
  }
);

// animasi
function animate() {
  requestAnimationFrame(animate);

  // Karakter tetap diam (tidak berputar)

  renderer.render(scene, camera);
}
animate();

// resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>
