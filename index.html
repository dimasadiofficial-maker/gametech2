<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bangun Ruang | Belajar Geometri Interaktif</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 20% 30%, #0a0f2a, #020617);
      position: relative;
    }

    /* Background blur circles */
    .bg-blur {
      position: fixed;
      width: 80vmax;
      height: 80vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 70%);
      top: -20%;
      right: -30%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-blur-left {
      left: -30%;
      bottom: -20%;
      background: radial-gradient(circle, rgba(168,85,247,0.12), transparent 70%);
    }

    /* Glow di belakang karakter (agar menyatu dengan UI) */
    .character-glow {
      position: fixed;
      left: 10%;
      top: 50%;
      transform: translateY(-50%);
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.22), rgba(59,130,246,0.08), transparent 70%);
      filter: blur(50px);
      z-index: 1;
      pointer-events: none;
    }

    /* Canvas 3D - di kiri tengah, tinggi 90%, lebar 48% */
    #character-canvas {
      position: fixed;
      left: -2%;
      bottom: 0;
      width: 60%;
      height: 95%;
      z-index: 10;
      pointer-events: none;
    }

    /* Container utama - flex row, item di tengah vertikal */
    .main-container {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8%;
    }

    /* Panel kanan - glassmorphism, posisi di kanan tengah */
    .hero-panel {
      background: rgba(15, 25, 45, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.4);
      padding: 2rem 2rem;
      width: 100%;
      max-width: 380px;
      transition: transform 0.2s;
    }

    /* Judul */
    .title {
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF, #93C5FD, #3B82F6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .title span {
      background: linear-gradient(135deg, #FBBF24, #F59E0B);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    /* Bubble chat */
    .bubble {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      border-top-left-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #e2e8f0;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.15);
      margin: 1rem 0;
    }

    /* Grid menu 2 kolom */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .menu-btn {
      background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1.2rem;
      padding: 0.8rem 0.5rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .menu-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(145deg, #3b82f6, #8b5cf6);
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 8px 18px -5px rgba(59,130,246,0.4);
    }
    .menu-btn:active {
      transform: scale(0.97);
    }

    /* Footer */
    .footer-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
    }

    /* Tombol mute */
    .mute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 30;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 40px;
      padding: 6px 14px;
      color: white;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .mute-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    /* Responsif untuk tablet */
    @media (max-width: 900px) {
      #character-canvas {
        left: 2%;
        width: 50%;
      }
      .main-container {
        padding-right: 4%;
      }
      .hero-panel {
        max-width: 340px;
        padding: 1.5rem;
      }
      .character-glow {
        left: 5%;
        width: 400px;
        height: 400px;
      }
    }

    /* Responsif untuk mobile */
    @media (max-width: 700px) {
      #character-canvas {
        width: 80%;
        height: 60%;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        opacity: 0.35;
      }
      .character-glow {
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        width: 300px;
        height: 300px;
        opacity: 0.4;
      }
      .main-container {
        align-items: flex-end;
        justify-content: center;
        padding-right: 0;
        padding-bottom: 2rem;
      }
      .hero-panel {
        max-width: 90%;
        margin: 0 auto;
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>

<div class="bg-blur"></div>
<div class="bg-blur bg-blur-left"></div>
<div class="character-glow"></div>

<!-- Canvas 3D -->
<div id="character-canvas"></div>

<div class="main-container">
  <div class="hero-panel">
    <div>
      <h1 class="title">AR BANGUN<span>RUANG</span></h1>
      <p class="subtitle">Media Pembelajaran Interaktif Matematika SD</p>
    </div>

    <div class="bubble">
      👋 Halo! Mari belajar bangun ruang bersama karakter 3D-ku!
    </div>

    <div class="menu-grid">
      <a href="menu/ar.html" class="menu-btn">🔮 AR</a>
      <a href="menu/materi.html" class="menu-btn">📘 Materi</a>
      <a href="menu/kuis.html" class="menu-btn">❓ Kuis</a>
      <a href="menu/game.html" class="menu-btn">🎮 Game</a>
    </div>

    <div class="footer-note">
      🔒 Geometri 3D · Belajar Jadi Seru
    </div>
  </div>
</div>

<button id="muteBtn" class="mute-btn">
  🔊 <span>Backsound</span>
</button>

<!-- Audio -->
<audio id="backsound" loop preload="auto">
  <source src="assets/sound/BacksoundceriauntukvideopembelajaranInstrumenMusikCeria.mpeg" type="audio/mpeg">
</audio>
<audio id="clickSound" preload="auto">
  <source src="assets/sound/klik.mpeg" type="audio/mpeg">
</audio>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('character-canvas');
const scene = new THREE.Scene();
scene.background = null;

// === KAMERA: posisi lebih ke tengah agar karakter proporsional ===
const camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0.5, 1.5, 4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x000000, 0);
container.appendChild(renderer.domElement);

// Pencahayaan
const ambient = new THREE.AmbientLight(0x404060, 1.2);
scene.add(ambient);
const mainLight = new THREE.DirectionalLight(0xfff5e0, 1.6);
mainLight.position.set(2, 3, 2.5);
scene.add(mainLight);
const fillLight = new THREE.PointLight(0xffaa66, 0.7);
fillLight.position.set(1.5, 1, 2);
scene.add(fillLight);
const rimLight = new THREE.PointLight(0x88aaff, 0.8);
rimLight.position.set(-1.2, 1.8, -2);
scene.add(rimLight);

// Load model 3D - Karakter DIAM (tanpa animasi idle)
let model;
const loader = new GLTFLoader();
loader.load('assets/model3D/anaksd.glb', (gltf) => {
  model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.x = -center.x;
  model.position.y = -center.y;
  model.position.z = -center.z;
  model.scale.set(1, 1, 1);
  model.position.x = 1;
  model.position.y = 0.1;
  model.rotation.y = 0.3;
  scene.add(model);
}, undefined, (err) => console.error('Gagal load model:', err));

// Animasi hanya render (tidak ada perubahan posisi/rotasi)
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

// Resize handler
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Audio handling
const backsound = document.getElementById('backsound');
const clickSound = document.getElementById('clickSound');
const muteButton = document.getElementById('muteBtn');
let audioActive = false;
let muted = false;

function enableAudio() {
  if (audioActive) return;
  backsound.play().then(() => {
    backsound.volume = 0.2;
    backsound.loop = true;
    audioActive = true;
  }).catch(() => {});
}
document.body.addEventListener('click', enableAudio, { once: true });
document.body.addEventListener('touchstart', enableAudio, { once: true });

muteButton.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!audioActive) return;
  if (muted) {
    backsound.play();
    muteButton.innerHTML = '🔊 <span>Backsound</span>';
  } else {
    backsound.pause();
    muteButton.innerHTML = '🔇 <span>Backsound</span>';
  }
  muted = !muted;
});

document.querySelectorAll('.menu-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (clickSound && audioActive) {
      clickSound.currentTime = 0;
      clickSound.play().catch(()=>{});
    }
  });
});
</script>
</body>
</html>
