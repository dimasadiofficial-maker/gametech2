<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bangun Ruang - Belajar Geometri</title>
  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Tailwind & Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="../manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; margin:0; overflow:hidden; }
    .ui-overlay { position: absolute; top:0; left:0; width:100%; height:100%; z-index:20; pointer-events: none; }
    .ui-overlay > * { pointer-events: auto; }
    .glass-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 1.5rem;
    }
    .shape-btn {
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .shape-btn.active {
      background: #3b82f6 !important;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(59,130,246,0.5);
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .status-pulse {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>
  <!-- Overlay UI -->
  <div class="ui-overlay flex flex-col justify-between p-4">
    <!-- Header -->
    <div class="flex justify-between items-center">
      <a href="../index.html" class="bg-black/40 backdrop-blur-md px-4 py-2 rounded-full text-white text-sm hover:bg-black/60 transition">
        ← Menu
      </a>
      <div id="status" class="bg-black/50 backdrop-blur-md px-4 py-2 rounded-full text-white text-sm flex items-center gap-2">
        <span class="w-2 h-2 bg-red-500 rounded-full status-pulse"></span>
        <span>Mencari Marker Hiro...</span>
      </div>
    </div>

    <!-- Info Panel (muncul saat marker ditemukan) -->
    <div id="info-panel" class="hidden glass-card p-5 text-white max-w-sm mx-auto mt-4 shadow-2xl">
      <div class="flex justify-between items-start">
        <h2 id="shape-name" class="text-2xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Balok</h2>
        <span id="shape-emoji" class="text-3xl">📦</span>
      </div>
      <div class="grid grid-cols-3 gap-3 mt-3 text-center">
        <div class="bg-white/10 rounded-xl p-2">
          <p class="text-xs text-blue-300">Sisi</p>
          <p id="shape-sisi" class="text-2xl font-bold">6</p>
        </div>
        <div class="bg-white/10 rounded-xl p-2">
          <p class="text-xs text-blue-300">Rusuk</p>
          <p id="shape-rusuk" class="text-2xl font-bold">12</p>
        </div>
        <div class="bg-white/10 rounded-xl p-2">
          <p class="text-xs text-blue-300">Sudut</p>
          <p id="shape-sudut" class="text-2xl font-bold">8</p>
        </div>
      </div>
      <div class="mt-3 text-sm text-white/80 text-center italic" id="shape-desc">
        Contoh: Kotak sepatu, lemari, batu bata
      </div>
    </div>

    <!-- Tombol pilih bangun ruang (scroll horizontal) -->
    <div class="flex gap-3 justify-center overflow-x-auto pb-2">
      <button class="shape-btn bg-black/40 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-medium" data-shape="balok">
        📦 Balok
      </button>
      <button class="shape-btn bg-black/40 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-medium" data-shape="bola">
        ⚽ Bola
      </button>
      <button class="shape-btn bg-black/40 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-medium" data-shape="kerucut">
        🎩 Kerucut
      </button>
      <button class="shape-btn bg-black/40 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-medium" data-shape="tabung">
        🥫 Tabung
      </button>
      <button class="shape-btn bg-black/40 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-medium" data-shape="prisma">
        🔺 Prisma
      </button>
    </div>
  </div>

  <!-- Audio elements (sesuai aset Anda) -->
  <audio id="backsound" loop preload="auto">
    <source src="../assets/sound/BacksoundceriauntukvideopembelajaranInstrumenMusikCeria.mpeg" type="audio/mpeg">
  </audio>
  <audio id="click-sound" preload="auto">
    <source src="../assets/sound/klik.mpeg" type="audio/mpeg">
  </audio>
  <audio id="success-sound" preload="auto">
    <source src="../assets/sound/berhasil.mpeg" type="audio/mpeg">
  </audio>

  <!-- A-Frame Scene -->
  <a-scene embedded 
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
           vr-mode-ui="enabled: false"
           renderer="antialias: true; alpha: false">
    
    <!-- Camera (otomatis ditambahkan AR.js) -->
    
    <!-- Marker Hiro -->
    <a-marker id="hiro-marker" preset="hiro">
      <!-- Model 3D akan diisi oleh JS -->
      <a-entity id="ar-model" gltf-model="../assets/model3D/balok.glb" scale="0.5 0.5 0.5" position="0 0 0">
        <a-animation attribute="rotation" dur="10000" fill="forwards" to="0 360 0" easing="linear" repeat="indefinite"></a-animation>
      </a-entity>
    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Mapping model 3D (path sesuai folder assets/model3D/)
    const models = {
      balok: '../assets/model3D/balok.glb',
      bola: '../assets/model3D/bola.glb',
      kerucut: '../assets/model3D/kerucut.glb',
      tabung: '../assets/model3D/tabung.glb',
      prisma: '../assets/model3D/prisma.glb'
    };
    
    // Data lengkap materi (nama, sisi, rusuk, sudut, deskripsi, emoji)
    const info = {
      balok: { name:'Balok', sisi:6, rusuk:12, sudut:8, desc:'Kotak sepatu, lemari, batu bata', emoji:'📦' },
      bola: { name:'Bola', sisi:1, rusuk:0, sudut:0, desc:'Bola basket, kelereng, melon', emoji:'⚽' },
      kerucut: { name:'Kerucut', sisi:2, rusuk:1, sudut:1, desc:'Topi ulang tahun, cone es krim, tumpeng', emoji:'🎩' },
      tabung: { name:'Tabung', sisi:3, rusuk:2, sudut:0, desc:'Kaleng susu, pipa, botol minum', emoji:'🥫' },
      prisma: { name:'Prisma Segitiga', sisi:5, rusuk:9, sudut:6, desc:'Tenda pramuka, cokelat Toblerone', emoji:'🔺' }
    };

    // Audio elements
    const backsound = document.getElementById('backsound');
    const clickSound = document.getElementById('click-sound');
    const successSound = document.getElementById('success-sound');
    
    // Set volume
    backsound.volume = 0.3;
    clickSound.volume = 0.5;
    successSound.volume = 0.7;
    
    let audioEnabled = false;
    // Fungsi mengaktifkan audio (karena autoplay diblokir)
    function enableAudio() {
      if (audioEnabled) return;
      backsound.play().then(() => {
        backsound.loop = true;
      }).catch(e => console.log("Backsound perlu klik user"));
      clickSound.play().then(() => clickSound.pause()).catch(e=>{});
      successSound.play().then(() => successSound.pause()).catch(e=>{});
      audioEnabled = true;
    }
    // Aktifkan saat user pertama kali menyentuh layar
    const enableOnce = () => {
      enableAudio();
      document.removeEventListener('click', enableOnce);
      document.removeEventListener('touchstart', enableOnce);
    };
    document.addEventListener('click', enableOnce);
    document.addEventListener('touchstart', enableOnce);
    
    function playClick() {
      if (!audioEnabled) return;
      clickSound.currentTime = 0;
      clickSound.play().catch(e=>{});
    }
    
    function playSuccess() {
      if (!audioEnabled) return;
      successSound.currentTime = 0;
      successSound.play().catch(e=>{});
    }
    
    // Elemen DOM
    const marker = document.getElementById('hiro-marker');
    const infoPanel = document.getElementById('info-panel');
    const statusDiv = document.getElementById('status');
    const shapeNameSpan = document.getElementById('shape-name');
    const shapeEmojiSpan = document.getElementById('shape-emoji');
    const shapeSisiSpan = document.getElementById('shape-sisi');
    const shapeRusukSpan = document.getElementById('shape-rusuk');
    const shapeSudutSpan = document.getElementById('shape-sudut');
    const shapeDescSpan = document.getElementById('shape-desc');
    
    // Ambil referensi entity model AR
    let arModelEntity = document.getElementById('ar-model');
    
    // Event marker ditemukan
    marker.addEventListener('markerFound', () => {
      infoPanel.classList.remove('hidden');
      statusDiv.innerHTML = '<span class="w-2 h-2 bg-green-500 rounded-full status-pulse"></span><span>✅ Marker Ditemukan!</span>';
      playSuccess(); // suara berhasil saat marker terdeteksi
    });
    
    marker.addEventListener('markerLost', () => {
      infoPanel.classList.add('hidden');
      statusDiv.innerHTML = '<span class="w-2 h-2 bg-red-500 rounded-full status-pulse"></span><span>🔍 Mencari Marker...</span>';
    });
    
    // Fungsi ganti shape (model 3D + info panel)
    function switchShape(type) {
      if (!models[type]) return;
      playClick(); // suara klik saat ganti shape
      // Update model 3D
      if (arModelEntity) {
        arModelEntity.setAttribute('gltf-model', models[type]);
        // Reset animasi rotasi (tetap berputar)
        arModelEntity.setAttribute('animation', 'property: rotation; dur: 10000; to: 0 360 0; loop: true; easing: linear');
      }
      // Update info panel
      const data = info[type];
      shapeNameSpan.textContent = data.name;
      shapeEmojiSpan.textContent = data.emoji;
      shapeSisiSpan.textContent = data.sisi;
      shapeRusukSpan.textContent = data.rusuk;
      shapeSudutSpan.textContent = data.sudut;
      shapeDescSpan.textContent = `Contoh: ${data.desc}`;
    }
    
    // Pasang event listener ke tombol
    document.querySelectorAll('.shape-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Hapus class active dari semua, tambahkan ke tombol yg diklik
        document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        switchShape(btn.dataset.shape);
      });
    });
    
    // Set shape default (balok) setelah scene siap
    setTimeout(() => {
      switchShape('balok');
      document.querySelector('.shape-btn[data-shape="balok"]').classList.add('active');
    }, 1000);
  </script>
</body>
</html>
