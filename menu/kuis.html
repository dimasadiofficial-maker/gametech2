<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Geometry Quiz | Petualangan Bangun Ruang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="../manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 30%, #0b1120, #020617);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiIHN0cm9rZS13aWR0aD0iMSIgZD0iTTAgMGw0MCA0ME0wIDQwTDQwIDAiLz48L3N2Zz4=');
      pointer-events: none;
      opacity: 0.4;
      z-index: 0;
    }
    .quiz-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 680px;
      margin: 20px;
    }
    .glass-panel {
      background: rgba(15, 25, 45, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 48px;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }
    .btn-glow {
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      background: linear-gradient(105deg, #3b82f6, #8b5cf6);
      border: none;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .btn-glow:hover {
      transform: scale(1.02);
      box-shadow: 0 0 18px rgba(59,130,246,0.5);
    }
    .option-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 60px;
      padding: 14px 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .option-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
    .correct-answer {
      background: #10b981 !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 12px #10b98180;
      transform: scale(1.01);
    }
    .wrong-answer {
      background: #ef4444 !important;
      border-color: #f87171 !important;
    }
    .timer-ring {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .timer-ring svg {
      transform: rotate(-90deg);
    }
    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      color: white;
    }
    @keyframes bounceGlow {
      0% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .feedback-pop {
      animation: bounceGlow 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #a855f7);
      transition: width 0.3s ease;
    }
    .rank-badge {
      background: rgba(0,0,0,0.5);
      border-radius: 60px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <!-- MENU AWAL -->
  <div id="menuPanel" class="glass-panel p-8 text-center">
    <div class="mb-4"><span class="text-7xl">📐✨</span></div>
    <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Petualangan Geometri</h1>
    <p class="text-white/60 mt-2 mb-6">Uji pengetahuanmu tentang bangun ruang!<br>15 pertanyaan seru + reward spesial</p>
    <button id="startQuizBtn" class="btn-glow w-full py-4 rounded-2xl text-white text-lg shadow-lg">🚀 Mulai Petualangan</button>
    <div class="flex justify-center gap-4 mt-6 text-white/50 text-sm">
      <a href="../index.html" class="hover:text-white transition">← Menu Utama</a>
      <a href="ar.html" class="hover:text-white transition">📷 AR</a>
      <a href="game.html" class="hover:text-white transition">🎮 Game</a>
    </div>
  </div>

  <!-- PANEL KUIS -->
  <div id="quizPanel" class="glass-panel p-6 hidden transition-all">
    <div class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-2 bg-white/10 rounded-full px-3 py-1">
        <span class="text-yellow-400">⭐</span>
        <span id="scoreValue" class="font-bold text-white">0</span>
      </div>
      <div class="rank-badge" id="rankBadge">🏁 Pemula</div>
      <div class="timer-ring">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,1.0)" stroke-width="4"/>
          <circle id="timerCircle" cx="28" cy="28" r="24" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="150.8" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <div class="timer-text" id="timerText">15</div>
      </div>
    </div>
    <div class="progress-bar mb-5">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="questionImgArea" class="flex justify-center mb-5 min-h-[130px]">
      <div id="questionIcon" class="w-28 h-28 bg-white/5 rounded-2xl flex items-center justify-center text-6xl shadow-inner"></div>
    </div>
    <h2 id="questionText" class="text-xl md:text-2xl font-bold text-white text-center mb-6 leading-tight">Memuat...</h2>
    <div id="optionsContainer" class="grid grid-cols-2 gap-3 mb-5"></div>
    <div id="feedbackToast" class="hidden fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-black/80 backdrop-blur-lg px-6 py-3 rounded-full text-white font-bold z-50 border border-white/20 shadow-2xl"></div>
  </div>
</div>

<!-- Audio -->
<audio id="correctSound" preload="auto"><source src="../assets/sound/berhasil.mpeg" type="audio/mpeg"></audio>
<audio id="wrongSound" preload="auto"><source src="../assets/sound/game%20over.mpeg" type="audio/mpeg"></audio>
<audio id="clickSound" preload="auto"><source src="../assets/sound/klik.mpeg" type="audio/mpeg"></audio>
<audio id="backsoundQuiz" loop preload="auto"><source src="../assets/sound/BacksoundceriauntukvideopembelajaranInstrumenMusikCeria.mpeg" type="audio/mpeg"></audio>

<script>
  // ---------- DATA SOAL (15 soal) ----------
  const QUESTIONS = [
    { text: "Berapa jumlah sisi pada bangun ruang KUBUS?", options: ["6", "8", "12", "4"], correct: 0, icon: "🧊", explanation: "Kubus memiliki 6 sisi berbentuk persegi." },
    { text: "Bangun ruang yang alas dan tutupnya berbentuk lingkaran disebut...", options: ["Tabung", "Kerucut", "Bola", "Prisma"], correct: 0, icon: "🥫", explanation: "Tabung memiliki alas dan tutup lingkaran." },
    { text: "Bentuk bola yang benar adalah...", options: ["Bulat sempurna", "Kotak", "Lonjong", "Segitiga"], correct: 0, icon: "⚽", explanation: "Bola adalah bangun ruang sisi lengkung yang bulat sempurna." },
    { text: "Bangun ruang ini memiliki 12 rusuk, 6 sisi, dan 8 titik sudut. Apakah itu?", options: ["Balok", "Prisma Segitiga", "Limas", "Kerucut"], correct: 0, icon: "📦", explanation: "Balok memiliki ciri tersebut." },
    { text: "Bangun ruang yang memiliki satu titik puncak dan alas berbentuk lingkaran adalah...", options: ["Kerucut", "Tabung", "Bola", "Limas"], correct: 0, icon: "🎩", explanation: "Kerucut memiliki puncak lancip." },
    { text: "Berapa jumlah rusuk pada Limas Segiempat?", options: ["8", "5", "6", "12"], correct: 0, icon: "🔺", explanation: "Limas segiempat memiliki 8 rusuk (4 alas + 4 tegak)." },
    { text: "Bangun prisma segitiga memiliki berapa sisi?", options: ["5", "6", "4", "8"], correct: 0, icon: "🔷", explanation: "Prisma segitiga: 2 sisi segitiga + 3 sisi tegak = 5 sisi." },
    { text: "Bangun ruang yang TIDAK memiliki titik sudut adalah...", options: ["Bola", "Kubus", "Balok", "Limas"], correct: 0, icon: "⚽", explanation: "Bola tidak memiliki titik sudut." },
    { text: "Jaring-jaring kubus tersusun dari berapa persegi?", options: ["6", "4", "8", "12"], correct: 0, icon: "🧩", explanation: "Jaring-jaring kubus terdiri dari 6 persegi." },
    { text: "Bangun ruang yang sisi alas dan atasnya berbentuk segitiga disebut...", options: ["Prisma", "Limas", "Kerucut", "Tabung"], correct: 0, icon: "📐", explanation: "Prisma memiliki alas dan tutup yang kongruen." },
    { text: "Berapa jumlah titik sudut pada prisma segienam?", options: ["12", "8", "10", "6"], correct: 0, icon: "🔶", explanation: "Prisma segienam memiliki 12 titik sudut (2 × 6)." },
    { text: "Bangun ruang yang memiliki 2 rusuk lengkung adalah...", options: ["Tabung", "Kerucut", "Bola", "Kubus"], correct: 0, icon: "🥫", explanation: "Tabung memiliki 2 rusuk lengkung (alas & tutup)." },
    { text: "Contoh benda berbentuk balok di rumah adalah...", options: ["Lemari", "Bola dunia", "Topi ulang tahun", "Kaleng susu"], correct: 0, icon: "🗄️", explanation: "Lemari memiliki bentuk balok." },
    { text: "Dadu berbentuk bangun ruang apa?", options: ["Kubus", "Balok", "Prisma", "Limas"], correct: 0, icon: "🎲", explanation: "Dadu berbentuk kubus." },
    { text: "Bangun ruang yang hanya memiliki 1 sisi (tanpa rusuk) adalah...", options: ["Bola", "Kerucut", "Tabung", "Prisma"], correct: 0, icon: "⚽", explanation: "Bola hanya memiliki 1 sisi lengkung." }
  ];

  // ---------- VARIABEL GAME ----------
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let timeLeft = 15;
  let timerInterval = null;
  let isAnswered = false;
  let transitioning = false;          
  let totalQuestions = 15;
  const circleCircumference = 2 * Math.PI * 25;

  // DOM references
  const menuPanel = document.getElementById('menuPanel');
  const quizPanel = document.getElementById('quizPanel');
  const startBtn = document.getElementById('startQuizBtn');
  const scoreSpan = document.getElementById('scoreValue');
  const rankBadge = document.getElementById('rankBadge');
  const timerText = document.getElementById('timerText');
  const timerCircle = document.getElementById('timerCircle');
  const progressFill = document.getElementById('progressFill');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const questionIcon = document.getElementById('questionIcon');
  const feedbackToast = document.getElementById('feedbackToast');

  // Audio
  const correctAudio = document.getElementById('correctSound');
  const wrongAudio = document.getElementById('wrongSound');
  const clickAudio = document.getElementById('clickSound');
  const backsound = document.getElementById('backsoundQuiz');
  let audioEnabled = false;

  function enableAudio() {
    if (audioEnabled) return;
    const tryPlay = (audio) => {
      if (audio) audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(() => {});
    };
    tryPlay(correctAudio);
    tryPlay(wrongAudio);
    tryPlay(clickAudio);
    tryPlay(backsound);
    backsound.volume = 0.2;
    backsound.loop = true;
    backsound.play().catch(e => console.log("backsound butuh interaksi"));
    audioEnabled = true;
  }

  function playSound(type) {
    if (!audioEnabled) return;
    const audio = type === 'correct' ? correctAudio : (type === 'wrong' ? wrongAudio : clickAudio);
    if (audio) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
  }

  function updateRank() {
    let rank = "🏁 Pemula";
    if (score >= 60) rank = "⭐ Bintang Muda";
    if (score >= 90) rank = "🏆 Petualang Handal";
    if (score >= 120) rank = "👑 Legenda Geometri";
    rankBadge.innerHTML = rank;
  }

  function rewardMilestone() {
    if (typeof canvasConfetti !== 'undefined') {
      if (score === 50 || score === 100 || score === 150) {
        canvasConfetti({ particleCount: 120, spread: 70, origin: { y: 0.6 }, startVelocity: 15, colors: ['#3b82f6', '#a855f7', '#facc15'] });
      }
      if (score >= 130 && score % 10 === 0) {
        canvasConfetti({ particleCount: 40, spread: 45, origin: { y: 0.7 } });
      }
    }
  }

  function updateTimerUI() {
    const percent = timeLeft / 15;
    const dashoffset = circleCircumference * (1 - percent);
    timerCircle.style.strokeDashoffset = dashoffset;
    timerText.innerText = timeLeft;
    timerCircle.style.stroke = timeLeft <= 3 ? "#ef4444" : "#60a5fa";
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function startTimer() {
    stopTimer();
    timeLeft = 15;
    updateTimerUI();
    timerInterval = setInterval(() => {
      if (!isAnswered && timeLeft > 0) {
        timeLeft--;
        updateTimerUI();
        if (timeLeft === 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      } else if (timeLeft <= 0) {
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  function handleTimeout() {
    if (isAnswered) return;
    isAnswered = true;
    playSound('wrong');
    const q = currentQuestions[currentIndex];
    showFeedback("⏰ Waktu habis! Jawaban: " + q.options[q.correct], false);
    // highlight jawaban benar
    const btns = document.querySelectorAll('.option-btn');
    if (btns[q.correct]) btns[q.correct].classList.add('correct-answer');
    setTimeout(() => {
      nextQuestion();
    }, 1500);
  }

  function showFeedback(msg, isCorrect) {
    feedbackToast.innerText = msg;
    feedbackToast.classList.remove('hidden');
    feedbackToast.style.background = isCorrect ? "rgba(16,185,129,0.9)" : "rgba(239,68,68,0.9)";
    feedbackToast.classList.add('feedback-pop');
    setTimeout(() => {
      feedbackToast.classList.add('hidden');
      feedbackToast.classList.remove('feedback-pop');
    }, 1200);
  }

  // Acak pilihan jawaban untuk satu soal
  function shuffleOptions(question) {
    const originalOptions = [...question.options];
    const originalCorrectValue = originalOptions[question.correct];
    const indices = originalOptions.map((_, idx) => idx);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    const shuffledOptions = indices.map(i => originalOptions[i]);
    const newCorrectIndex = indices.findIndex(i => i === question.correct);
    return { ...question, options: shuffledOptions, correct: newCorrectIndex };
  }

  function loadQuestion() {
    isAnswered = false;
    const rawQuestion = currentQuestions[currentIndex];
    const q = shuffleOptions(rawQuestion);

    questionText.innerText = q.text;
    questionIcon.innerHTML = `<div class="text-7xl drop-shadow-2xl">${q.icon || "📐"}</div>`;

    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('div');
      btn.className = "option-btn text-white text-base md:text-lg";
      btn.innerText = opt;
      btn.addEventListener('click', function() {
        if (isAnswered) return;
        playSound('click');
        isAnswered = true;
        stopTimer();
        timeLeft = 15;
        updateTimerUI();

        const isCorrect = (idx === q.correct);
        if (isCorrect) {
          const gain = 10;
          score += gain;
          scoreSpan.innerText = score;
          playSound('correct');
          showFeedback(`✅ Benar! +${gain} poin`, true);
          this.classList.add('correct-answer');
          rewardMilestone();
          updateRank();
        } else {
          playSound('wrong');
          showFeedback(`❌ Salah! Jawaban benar: ${q.options[q.correct]}`, false);
          this.classList.add('wrong-answer');
          const allBtns = document.querySelectorAll('.option-btn');
          if (allBtns[q.correct]) allBtns[q.correct].classList.add('correct-answer');
        }
        setTimeout(() => {
          nextQuestion();
        }, 1300);
      });
      optionsContainer.appendChild(btn);
    });

    startTimer();
    updateProgress();
    updateRank();
  }

  function updateProgress() {
    const progressPercent = ((currentIndex + 1) / totalQuestions) * 100;
    progressFill.style.width = `${progressPercent}%`;
  }

  function nextQuestion() {
    if (transitioning) return;
    transitioning = true;
    currentIndex++;
    if (currentIndex >= totalQuestions) {
      finishQuiz();
    } else {
      loadQuestion();
    }
    setTimeout(() => { transitioning = false; }, 100);
  }

  function finishQuiz() {
    stopTimer();
    const maxScore = totalQuestions * 10;
    let finalMessage = "", emoji = "";
    if (score === maxScore) {
      emoji = "🏆👑🏆";
      finalMessage = "Sempurna! Kamu benar-benar Legenda Geometri!";
      if (typeof canvasConfetti !== 'undefined') canvasConfetti({ particleCount: 300, spread: 100, origin: { y: 0.5 }, startVelocity: 20 });
    } else if (score >= 120) {
      emoji = "👑✨";
      finalMessage = "Hebat! Kamu mahir bangun ruang!";
      if (typeof canvasConfetti !== 'undefined') canvasConfetti({ particleCount: 150, spread: 70 });
    } else if (score >= 80) {
      emoji = "⭐🌟";
      finalMessage = "Kerja bagus! Tingkatkan lagi ya!";
    } else {
      emoji = "📚💪";
      finalMessage = "Terus belajar, kamu pasti bisa!";
    }
    questionText.innerHTML = `${emoji}  Kuis Selesai!  ${emoji}<br><span class="text-lg">Skor akhir: ${score} / ${maxScore}</span><br><span class="text-sm text-white/70">${finalMessage}</span>`;
    questionIcon.innerHTML = `<div class="text-8xl">🏅</div>`;
    optionsContainer.innerHTML = `
      <div class="col-span-2 flex flex-col gap-3 mt-4">
        <button id="restartQuizBtn" class="btn-glow py-3 rounded-xl text-white">🔄 Main Lagi</button>
        <button id="menuQuizBtn" class="bg-white/10 border border-white/20 py-3 rounded-xl text-white hover:bg-white/20">🏠 Kembali ke Menu</button>
      </div>
    `;
    document.getElementById('restartQuizBtn')?.addEventListener('click', resetAndStart);
    document.getElementById('menuQuizBtn')?.addEventListener('click', () => { window.location.href = '../index.html'; });
    updateRank();
    document.querySelector('.timer-ring').style.opacity = '0.5';
  }

  function resetAndStart() {
    currentIndex = 0;
    score = 0;
    scoreSpan.innerText = "0";
    updateRank();
    currentQuestions = [...QUESTIONS];
    for (let i = currentQuestions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
    }
    totalQuestions = currentQuestions.length;
    document.querySelector('.timer-ring').style.opacity = '1';
    isAnswered = false;
    transitioning = false;
    loadQuestion();
  }

  function initGame() {
    enableAudio();
    menuPanel.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    resetAndStart();
  }

  startBtn.addEventListener('click', initGame);

  // Set default lingkaran timer
  timerCircle.style.strokeDasharray = circleCircumference;
  timerCircle.style.strokeDashoffset = 0;
</script>
</body>
</html>
