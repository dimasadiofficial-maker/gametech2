<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Geometry Quiz - SD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="../manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .correct { background: #22c55e !important; }
    .wrong { background: #ef4444 !important; }
    .feedback-show { animation: pop 0.4s ease; }
    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center bg-cover bg-center" style="background-image:url('../assets/picture/background.jpg')">
<div class="absolute inset-0 bg-black/60"></div>

<!-- Tombol kembali -->
<div class="fixed top-4 left-4 z-20">
  <a href="../index.html" class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full text-sm hover:bg-white/30 transition">← Kembali ke Menu</a>
</div>

<!-- MENU -->
<div id="menu" class="relative z-10 w-full max-w-xl p-6">
  <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 text-center">
    <h1 class="text-3xl font-extrabold mb-2">🎮 Geometry Quiz SD</h1>
    <p class="text-white/70 mb-6">Khusus Anak Sekolah Dasar</p>
    <button id="startBtn" class="w-full bg-blue-500 py-3 rounded-xl font-bold text-lg">Mulai Kuis</button>
  </div>
</div>

<!-- GAME (awal disembunyikan) -->
<div id="game" class="hidden relative z-10 w-full max-w-xl p-6">
  <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 text-center">
    <div class="flex justify-between text-sm mb-2">
      <div>Skor: <span id="score">0</span></div>
      <div>Rank: <span id="rank">-</span></div>
      <div>⏱ <span id="time">15</span></div>
    </div>
    <div id="questionImg" class="mx-auto mb-6 rounded-2xl w-full max-w-[200px] h-[200px] flex items-center justify-center bg-white/5 p-4 hidden shadow-2xl border border-white/10"></div>
    <h2 id="question" class="text-lg font-semibold mb-5">Loading...</h2>
    <div id="options" class="grid grid-cols-2 gap-3"></div>
  </div>
  <div id="feedback" class="hidden absolute inset-0 flex items-center justify-center text-5xl font-extrabold z-50"></div>
</div>

<audio id="correct-sound" preload="auto"><source src="../assets/sound/berhasil.mpeg" type="audio/mpeg"></audio>
<audio id="wrong-sound" preload="auto"><source src="../assets/sound/game%20over.mpeg" type="audio/mpeg"></audio>
<audio id="click-sound" preload="auto"><source src="../assets/sound/klik.mpeg" type="audio/mpeg"></audio>

<script>
// Ikon SVG (diringkas agar tidak terlalu panjang, tetap lengkap)
const shapeIcons = {
  'cube.svg': `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M50 20 L80 35 L80 65 L50 80 L20 65 L20 35 Z" fill="#60a5fa"/><path d="M50 20 L80 35 L50 50 L20 35 Z" fill="#93c5fd"/><path d="M50 50 L80 35 L80 65 L50 80 Z" fill="#2563eb"/><path d="M50 20 L80 35 L80 65 L50 80 L20 65 L20 35 Z" fill="none" stroke="#1e3a8a" stroke-width="1.5"/><path d="M20 35 L50 50 L80 35 M50 50 L50 80" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-opacity="0.3"/></svg>`,
  'cuboid.svg': `<svg viewBox="0 0 1００ 1００" class="w-full h-full"><path d="M1５ 4０ L6５ 4０ L8５ 2５ L3５ 2５ Z" fill="#fca５a５"/><path d="M1５ 4０ L6５ 4０ L6５ 7５ L1５ 7５ Z" fill="#ef4444"/><path d="M6５ 4０ L8５ 2５ L8５ 6０ L6５ 7５ Z" fill="#b91c1c"/><path d="M1５ 4０ L6５ 4０ L8５ 2５ L8５ 6０ L6５ 7５ L1５ 7５ Z" fill="none" stroke="#7f1d1d" stroke-width="1.5"/><path d="M6５ 4０ L8５ 2５" fill="none" stroke="#7f1d1d" stroke-width="1.5" stroke-opacity="0.3"/></svg>`,
  'cone.svg': `<svg viewBox="0 0 100 100" class="w-full h-full"><defs><linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6b21a8"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient></defs><path d="M50 15 L20 75 A30 10 0 0 0 80 75 Z" fill="url(#coneGrad)" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="50" cy="75" rx="30" ry="10" fill="#c084fc" fill-opacity="0.3" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`,
  'pyramid-square.svg': `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M50 15 L20 75 L50 85 Z" fill="#f97316"/><path d="M50 15 L80 75 L50 85 Z" fill="#c2410c"/><path d="M50 15 L20 75 L80 75 Z" fill="#fdba74" fill-opacity="0.3"/><path d="M50 15 L20 75 L50 85 L80 75 Z" fill="none" stroke="#7c2d12" stroke-width="1.5"/><path d="M50 15 L50 85" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-opacity="0.3"/></svg>`,
  'prism-triangular.svg': `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M25 25 L50 40 L25 80 Z" fill="#06b6d4"/><path d="M25 25 L75 25 L50 40 Z" fill="#67e8f9"/><path d="M75 25 L50 40 L50 80 L75 80 Z" fill="#0e7490"/><path d="M25 25 L75 25 L75 80 L50 80 L25 80 Z" fill="none" stroke="#164e63" stroke-width="1.5"/><path d="M50 40 L25 25 M50 40 L75 25 M50 40 L50 80" fill="none" stroke="#164e63" stroke-width="1.5" stroke-opacity="0.3"/></svg>`,
  'prism-hexagonal.svg': `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M35 20 L65 20 L75 35 L65 50 L35 50 L25 35 Z" fill="#f9a8d4"/><path d="M25 35 L25 75 L35 90 L35 50 Z" fill="#ec4899"/><path d="M35 50 L35 90 L65 90 L65 50 Z" fill="#db2777"/><path d="M65 50 L65 90 L75 75 L75 35 Z" fill="#9d174d"/><path d="M35 20 L65 20 L75 35 L75 75 L65 90 L35 90 L25 75 L25 35 Z" fill="none" stroke="#831843" stroke-width="1.5"/></svg>`,
  'cube-net.svg': `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M40 20 H60 V40 H80 V60 H60 V80 H40 V60 H20 V40 H40 Z" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4"/></svg>`
};

const questionsSD = [
  { q: "Berapa jumlah sisi pada kubus?", a: ["6", "8", "12", "4"], c: 0, img: "cube.svg" },
  { q: "Bangun ruang yang memiliki alas dan tutup berbentuk lingkaran adalah...", a: ["Tabung", "Kerucut", "Bola", "Kubus"], c: 0, img: "cylinder.svg" },
  { q: "Bentuk bola yang benar adalah...", a: ["Bulat", "Kotak", "Lonjong", "Segitiga"], c: 0, img: "sphere.svg" },
  { q: "Bangun ruang ini disebut dengan...", a: ["Balok", "Kubus", "Prisma", "Limas"], c: 0, img: "cuboid.svg" },
  { q: "Bangun ruang yang memiliki satu titik puncak lancip adalah...", a: ["Kerucut", "Tabung", "Bola", "Prisma"], c: 0, img: "cone.svg" },
  { q: "Bangun ruang ini adalah...", a: ["Limas Segiempat", "Prisma", "Balok", "Tabung"], c: 0, img: "pyramid-square.svg" },
  { q: "Ini adalah gambar dari...", a: ["Prisma Segitiga", "Limas", "Kerucut", "Tabung"], c: 0, img: "prism-triangular.svg" },
  { q: "Gambar ini menunjukkan pola dari...", a: ["Jaring-jaring", "Sisi", "Rusuk", "Titik Sudut"], c: 0, img: "cube-net.svg" },
  { q: "Bangun ruang yang memiliki sisi alas dan tutup yang sama (identik) disebut...", a: ["Prisma", "Limas", "Bola", "Kerucut"], c: 0, img: "prism-hexagonal.svg" },
  { q: "Berapa jumlah titik sudut pada Limas Segiempat?", a: ["5", "4", "6", "8"], c: 0, img: "pyramid-square.svg" }
];

let questions = [], index = 0, score = 0, time = 15, timer;
const correctAudio = document.getElementById('correct-sound');
const wrongAudio = document.getElementById('wrong-sound');
const clickAudio = document.getElementById('click-sound');
let audioEnabled = false;

function enableAudio() {
  if (audioEnabled) return;
  const init = (a) => { a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(e=>{}); };
  init(correctAudio); init(wrongAudio); init(clickAudio);
  audioEnabled = true;
}
function playCorrect() { if(audioEnabled){ correctAudio.currentTime=0; correctAudio.play(); } }
function playWrong() { if(audioEnabled){ wrongAudio.currentTime=0; wrongAudio.play(); } }
function playClick() { if(audioEnabled){ clickAudio.currentTime=0; clickAudio.play(); } }

function startGame() {
  enableAudio();
  questions = [...questionsSD].sort(() => Math.random() - 0.5);
  index = 0; score = 0;
  document.getElementById('score').innerText = 0;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  loadQ();
}

function loadQ() {
  clearInterval(timer);
  time = 15;
  const q = questions[index];
  document.getElementById('time').innerText = time;
  document.getElementById('question').innerText = q.q;
  const imgBox = document.getElementById('questionImg');
  imgBox.classList.remove('hidden');
  imgBox.innerHTML = shapeIcons[q.img] || '';
  const opt = document.getElementById('options');
  opt.innerHTML = '';
  q.a.forEach((x, i) => {
    const btn = document.createElement('button');
    btn.innerText = x;
    btn.className = "bg-white/20 p-3 rounded-xl transition hover:bg-white/30";
    btn.onclick = () => check(i, btn);
    opt.appendChild(btn);
  });
  timer = setInterval(() => {
    time--;
    document.getElementById('time').innerText = time;
    if (time <= 0) next();
  }, 1000);
  updateRank();
}

function check(i, btn) {
  playClick();
  const q = questions[index];
  const btns = document.querySelectorAll('#options button');
  const feedback = document.getElementById('feedback');
  feedback.classList.remove('hidden');
  if (i === q.c) {
    btn.classList.add('correct');
    score += 10;
    playCorrect();
    feedback.innerText = "✅ BENAR!";
    feedback.style.color = "#22c55e";
  } else {
    btn.classList.add('wrong');
    btns[q.c].classList.add('correct');
    playWrong();
    feedback.innerText = "❌ SALAH!";
    feedback.style.color = "#ef4444";
  }
  feedback.classList.add('feedback-show');
  document.getElementById('score').innerText = score;
  setTimeout(() => {
    feedback.classList.add('hidden');
    feedback.classList.remove('feedback-show');
    next();
  }, 800);
}

function next() {
  clearInterval(timer);
  index++;
  if (index >= questions.length) {
    document.getElementById('question').innerText = "🎉 Kuis Selesai!";
    document.getElementById('options').innerHTML = `<div class="col-span-2 text-center p-4 text-xl">Skor akhir: ${score}</div>`;
    document.getElementById('questionImg').classList.add('hidden');
    const optDiv = document.getElementById('options');
    const replayBtn = document.createElement('button');
    replayBtn.innerText = "🔁 Main Lagi";
    replayBtn.className = "col-span-2 bg-blue-500 p-3 rounded-xl mt-2";
    replayBtn.onclick = () => { location.reload(); };
    optDiv.appendChild(replayBtn);
    return;
  }
  loadQ();
}

function updateRank() {
  let r = "Pembalap Pemula";
  if (score >= 40) r = "Pembalap Handal";
  if (score >= 70) r = "Juara Kelas";
  if (score >= 90) r = "Legenda Geometri";
  document.getElementById('rank').innerText = r;
}

document.getElementById('startBtn').addEventListener('click', startGame);
</script>
</body>
</html>
